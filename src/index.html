<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>radio · 013370000.xyz</title>

  <meta name="description" content="Minimalist audio radio stream. Continuous 24/7 high bitrate streaming." />
  <meta name="author" content="013370000" />

  <link rel="icon" type="image/png" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📻</text></svg>" />

  <style>
    @import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&display=swap');

    *, *::before, *::after {
      box-sizing: border-box;
    }

    body {
      font-family: 'IBM Plex Mono', 'Courier New', monospace;
      font-size: 13px;
      margin: 0;
      padding: 0;
      background: #050505;
      color: #c8c8c8;
      line-height: 1.6;
    }

    .container {
      max-width: 580px;
      margin: 0 auto;
      padding: 48px 24px 64px;
    }

    h1 {
      font-size: 15px;
      font-weight: 500;
      margin: 0 0 4px;
      color: #f0f0f0;
      letter-spacing: 0.01em;
    }

    p.subtitle {
      margin: 0 0 28px;
      color: #555;
      font-size: 12px;
    }

    .card {
      display: grid;
      gap: 0;
      border: 1px solid #1a1a1a;
      border-radius: 4px;
      overflow: hidden;
      background: #0a0a0a;
    }

    .row {
      display: grid;
      gap: 2px;
      font-size: 11px;
      color: #444;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      border-bottom: 1px solid #1a1a1a;
      padding: 12px 16px;
      background: #0a0a0a;
    }

    .row .val {
      font-size: 13px;
      color: #d8d8d8;
      text-transform: none;
      letter-spacing: normal;
      font-weight: 500;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .row.genre-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .row.genre-row .genre-tag {
      color: #7a553a;
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.06em;
    }

    .visualizer-container {
      height: 42px;
      background: #070707;
      border-bottom: 1px solid #1a1a1a;
      display: flex;
      align-items: flex-end;
      padding: 0 16px;
      gap: 3px;
      transition: height 0.25s ease, opacity 0.25s ease, padding 0.25s ease;
      overflow: hidden;
    }

    .visualizer-container.hidden {
      height: 0;
      padding-top: 0;
      padding-bottom: 0;
      border-bottom: none;
      opacity: 0;
    }

    canvas#viz-canvas {
      width: 100%;
      height: 100%;
      display: block;
    }

    .progress-container {
      padding: 14px 16px;
      border-bottom: 1px solid #1a1a1a;
      background: #080808;
    }

    .progress-bar-bg {
      width: 100%;
      height: 3px;
      background: #151515;
      border-radius: 2px;
      overflow: hidden;
      margin-bottom: 8px;
    }

    .progress-bar-fill {
      height: 100%;
      width: 0%;
      background: #888;
      transition: width 1s linear;
    }

    .time-display {
      display: flex;
      justify-content: space-between;
      font-size: 11px;
      color: #444;
    }

    .controls {
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-top: 1px solid #1a1a1a;
      padding: 12px 16px;
      background: #0f0f0f;
    }

    .controls-left {
      display: flex;
      align-items: center;
      gap: 12px;
      position: relative;
    }

    .volume-wrapper {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    button.icon-btn {
      border: 1px solid #222;
      background: #151515;
      color: #888;
      cursor: pointer;
      width: 32px;
      height: 32px;
      border-radius: 4px;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: color 0.15s, background 0.15s, border-color 0.15s;
      padding: 0;
      flex-shrink: 0;
    }

    button.icon-btn:hover {
      background: #202020;
      color: #f0f0f0;
      border-color: #333;
    }

    button.icon-btn svg {
      width: 16px;
      height: 16px;
      fill: currentColor;
    }

    .volume-slider-container {
      width: 0;
      opacity: 0;
      overflow: hidden;
      transition: width 0.25s ease, opacity 0.25s ease;
      display: flex;
      align-items: center;
    }

    .volume-wrapper:hover .volume-slider-container,
    .volume-slider-container:hover {
      width: 90px;
      opacity: 1;
    }

    input[type="range"].volume-slider {
      -webkit-appearance: none;
      width: 80px;
      height: 3px;
      background: #252525;
      border-radius: 2px;
      outline: none;
      cursor: pointer;
    }

    input[type="range"].volume-slider::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: #888;
      cursor: pointer;
      transition: background 0.15s;
    }

    input[type="range"].volume-slider::-webkit-slider-thumb:hover {
      background: #d8d8d8;
    }

    .status-indicator {
      display: inline-block;
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #333;
      margin-right: 8px;
    }

    .status-indicator.live {
      background: #3a7a3a;
      box-shadow: 0 0 8px rgba(58, 122, 58, 0.6);
    }

    .vlc-info {
      margin-top: 24px;
      border: 1px solid #151515;
      border-radius: 4px;
      background: #070707;
      padding: 14px 16px;
    }

    .vlc-info label {
      font-size: 11px;
      color: #444;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      display: block;
      margin-bottom: 6px;
    }

    .vlc-url {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .vlc-url input {
      width: 100%;
      border: 1px solid #1c1c1c;
      background: #050505;
      color: #888;
      font-family: inherit;
      font-size: 12px;
      padding: 6px 10px;
      border-radius: 3px;
      outline: none;
    }

    .vlc-url button {
      border: 1px solid #1c1c1c;
      background: #0f0f0f;
      color: #666;
      font-family: inherit;
      font-size: 11px;
      padding: 6px 12px;
      border-radius: 3px;
      cursor: pointer;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      transition: background 0.15s, color 0.15s;
      white-space: nowrap;
    }

    .vlc-url button:hover {
      background: #181818;
      color: #ccc;
    }

    a.json-btn {
      border: 1px solid #1c1c1c;
      background: #0f0f0f;
      color: #777;
      text-decoration: none;
      font-size: 11px;
      padding: 4px 8px;
      border-radius: 3px;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      transition: background 0.15s, color 0.15s, border-color 0.15s;
      white-space: nowrap;
    }

    a.json-btn:hover {
      background: #181818;
      color: #d8d8d8;
      border-color: #2c2c2c;
    }

    .footer {
      margin-top: 48px;
      text-align: center;
      font-size: 11px;
      color: #333;
    }

    .footer a {
      color: #444;
      text-decoration: none;
      transition: color 0.15s;
    }

    .footer a:hover {
      color: #888;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>radio · 013370000.xyz</h1>
    <p class="subtitle">headless continuous icecast stream in rust</p>

    <div class="card">
      <div class="row" style="display: flex; justify-content: space-between; align-items: center;">
        <div>
          <span>NOW PLAYING</span>
          <div class="val" id="track-title">Loading stream metadata...</div>
        </div>
        <a href="/now-playing" target="_blank" class="json-btn">JSON</a>
      </div>

      <div class="row">
        <span>ARTIST</span>
        <div class="val" id="track-artist">—</div>
      </div>

      <div class="row genre-row">
        <div>
          <span>ALBUM</span>
          <div class="val" id="track-album">—</div>
        </div>
        <div class="genre-tag" id="track-genre">GENRE</div>
      </div>

      <div class="visualizer-container">
        <canvas id="viz-canvas"></canvas>
      </div>

      <div class="progress-container">
        <div class="progress-bar-bg">
          <div class="progress-bar-fill" id="progress-fill"></div>
        </div>
        <div class="time-display">
          <span id="time-elapsed">00:00</span>
          <span id="listeners-count">0 listeners</span>
          <span id="time-duration">00:00</span>
        </div>
      </div>

      <div class="controls">
        <div class="controls-left">
          <div class="volume-wrapper">
            <button class="icon-btn" id="mute-btn" title="Toggle Mute / Unmute">
              <svg id="icon-muted" viewBox="0 0 24 24">
                <path d="M16.5 12c0-1.77-1.02-3.29-2.5-4.03v2.21l2.45 2.45c.03-.2.05-.41.05-.63zm2.5 0c0 .94-.2 1.82-.54 2.64l1.51 1.51C20.63 14.91 21 13.5 21 12c0-4.28-2.99-7.86-7-8.77v2.06c2.89.86 5 3.54 5 6.71zM4.27 3L3 4.27 7.73 9H3v6h4l5 5v-6.73l4.25 4.25c-.67.52-1.42.93-2.25 1.18v2.06c1.38-.31 2.63-.95 3.69-1.81L19.73 21 21 19.73 4.27 3zM12 4L9.91 6.09 12 8.18V4z"/>
              </svg>
              <svg id="icon-unmuted" viewBox="0 0 24 24" style="display: none;">
                <path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"/>
              </svg>
            </button>
            <div class="volume-slider-container">
              <input type="range" id="volume-slider" class="volume-slider" min="0" max="1" step="0.01" value="1" title="Volume" />
            </div>
          </div>
          <span style="font-size: 11px; color: #666; text-transform: uppercase; letter-spacing: 0.05em;"><span class="status-indicator live" id="status-dot"></span><span id="status-text">MUTED</span></span>
        </div>
        <span style="font-size: 10px; color: #444;">[INSTANT PLAY]</span>
      </div>
    </div>

    <div class="vlc-info">
      <label>Direct Stream URL (VLC / mpv / ffmpeg)</label>
      <div class="vlc-url">
        <input type="text" id="stream-url-input" readonly value="" />
        <button id="copy-btn">Copy</button>
      </div>
    </div>

    <div class="footer">
      <span>design inspired by <a href="https://nnn.pm" target="_blank">nnn.pm</a></span>
    </div>
  </div>

  <audio id="audio-player" crossorigin="anonymous" autoplay muted preload="none"></audio>

  <script>
    const audio = document.getElementById('audio-player');
    const muteBtn = document.getElementById('mute-btn');
    const volumeSlider = document.getElementById('volume-slider');
    const iconMuted = document.getElementById('icon-muted');
    const iconUnmuted = document.getElementById('icon-unmuted');
    const statusText = document.getElementById('status-text');
    const titleEl = document.getElementById('track-title');
    const artistEl = document.getElementById('track-artist');
    const albumEl = document.getElementById('track-album');
    const genreEl = document.getElementById('track-genre');
    const elapsedEl = document.getElementById('time-elapsed');
    const durationEl = document.getElementById('time-duration');
    const listenersEl = document.getElementById('listeners-count');
    const progressFill = document.getElementById('progress-fill');
    const streamUrlInput = document.getElementById('stream-url-input');
    const copyBtn = document.getElementById('copy-btn');
    const canvas = document.getElementById('viz-canvas');
    const ctx = canvas.getContext('2d');

    const fullStreamUrl = window.location.origin + '/stream';
    streamUrlInput.value = fullStreamUrl;

    copyBtn.addEventListener('click', () => {
      navigator.clipboard.writeText(fullStreamUrl);
      copyBtn.innerText = 'Copied!';
      setTimeout(() => { copyBtn.innerText = 'Copy'; }, 2000);
    });

    let currentTrackTitle = '';
    let audioCtx, analyser, dataArray;

    function initAudioContext() {
      if (audioCtx) return;
      try {
        const AudioContext = window.AudioContext || window.webkitAudioContext;
        audioCtx = new AudioContext();
        analyser = audioCtx.createAnalyser();
        analyser.fftSize = 64;
        const source = audioCtx.createMediaElementSource(audio);
        source.connect(analyser);
        analyser.connect(audioCtx.destination);
        dataArray = new Uint8Array(analyser.frequencyBinCount);
        drawVisualizer();
      } catch (e) {
        console.warn("Visualizer fallback mode", e);
        drawFallbackVisualizer();
      }
    }

    const vizContainer = document.querySelector('.visualizer-container');

    function drawVisualizer() {
      requestAnimationFrame(drawVisualizer);

      const isPlaying = !audio.paused && !audio.muted && audio.src;
      if (!isPlaying) {
        vizContainer.classList.add('hidden');
        return;
      }

      vizContainer.classList.remove('hidden');

      const width = canvas.width = canvas.clientWidth;
      const height = canvas.height = canvas.clientHeight;

      ctx.clearRect(0, 0, width, height);

      if (!analyser) {
        return;
      }

      analyser.getByteFrequencyData(dataArray);

      const numBars = Math.floor(dataArray.length / 2);
      const gap = 2;
      const barWidth = (width / (numBars * 2)) - gap;
      const centerX = width / 2;

      for (let i = 0; i < numBars; i++) {
        const val = dataArray[i];
        const barHeight = (val / 255) * height;
        ctx.fillStyle = '#444';

        // Right side bar from center
        const rightX = centerX + (i * (barWidth + gap)) + (gap / 2);
        ctx.fillRect(rightX, height - barHeight, barWidth, barHeight);

        // Left side bar from center (mirror)
        const leftX = centerX - ((i + 1) * (barWidth + gap)) + (gap / 2);
        ctx.fillRect(leftX, height - barHeight, barWidth, barHeight);
      }
    }

    function connectAudioStream() {
      audio.src = '/stream?t=' + Date.now();
      audio.currentTime = 0;
      audio.play().catch(err => {
        console.warn("Audio play prevented:", err);
      });
    }

    muteBtn.addEventListener('click', () => {
      initAudioContext();
      if (audioCtx && audioCtx.state === 'suspended') {
        audioCtx.resume();
      }

      if (audio.muted || !audio.src) {
        audio.muted = false;
        if (!audio.src || audio.paused) {
          connectAudioStream();
        }
        iconMuted.style.display = 'none';
        iconUnmuted.style.display = 'block';
        statusText.innerText = 'LIVE STREAMING';
      } else {
        audio.muted = true;
        iconMuted.style.display = 'block';
        iconUnmuted.style.display = 'none';
        statusText.innerText = 'MUTED';
      }
    });

    volumeSlider.addEventListener('input', (e) => {
      const val = parseFloat(e.target.value);
      audio.volume = val;
      if (val === 0) {
        audio.muted = true;
        iconMuted.style.display = 'block';
        iconUnmuted.style.display = 'none';
      } else if (audio.muted) {
        audio.muted = false;
        iconMuted.style.display = 'none';
        iconUnmuted.style.display = 'block';
      }
    });

    function formatTime(secs) {
      if (!secs || isNaN(secs)) return '00:00';
      const m = Math.floor(secs / 60);
      const s = Math.floor(secs % 60);
      return `${m < 10 ? '0' : ''}${m}:${s < 10 ? '0' : ''}${s}`;
    }

    function updateMetadataUI(data) {
      if (!data) return;

      if (data.title && data.title !== currentTrackTitle && currentTrackTitle !== '') {
        currentTrackTitle = data.title;
        if (!audio.muted && audio.src) {
          console.log("Track changed, reconnecting stream to purge browser audio buffer...");
          connectAudioStream();
        }
      } else if (!currentTrackTitle && data.title) {
        currentTrackTitle = data.title;
      }

      titleEl.innerText = data.title || 'Unknown Title';
      artistEl.innerText = data.artist || 'Unknown Artist';
      albumEl.innerText = data.album || '—';
      genreEl.innerText = data.genre || 'GENERAL';
      
      elapsedEl.innerText = formatTime(data.elapsed_secs);
      durationEl.innerText = formatTime(data.duration_secs);
      listenersEl.innerText = `${data.listeners || 0} listener${data.listeners === 1 ? '' : 's'}`;

      if (data.duration_secs > 0) {
        const pct = Math.min(100, (data.elapsed_secs / data.duration_secs) * 100);
        progressFill.style.width = `${pct}%`;
      } else {
        progressFill.style.width = '0%';
      }
    }

    const eventSource = new EventSource('/api/metadata/sse');
    eventSource.onmessage = (event) => {
      try {
        const data = JSON.parse(event.data);
        updateMetadataUI(data);
      } catch(e) {
        console.error(e);
      }
    };

    setInterval(() => {
      fetch('/api/metadata')
        .then(r => r.json())
        .then(data => updateMetadataUI(data))
        .catch(() => {});
    }, 3000);

    drawFallbackVisualizer();
  </script>
</body>
</html>
